<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: white;
    }
  </style>
</head>

<body>
  <audio id="bgMusic" preload="auto" loop>
    <source src="./Nobody%20To%20Love.mp3" type="audio/mpeg">
  </audio>

  <script>
    const music = document.getElementById("bgMusic");

    async function startMusic() {
      try {
        music.volume = 1;
        await music.play();
        console.log("Music started");
      } catch (error) {
        console.log("Click inside the page to start music:", error);
      }
    }

    // Try autoplay first
    startMusic();

    // Any click anywhere inside the page starts it
    document.documentElement.addEventListener("click", startMusic);
    document.documentElement.addEventListener("pointerdown", startMusic);
    document.documentElement.addEventListener("touchstart", startMusic);
  </script>
</body>
</html>
