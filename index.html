<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: transparent;
      overflow: hidden;
    }

    #start {
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      cursor: pointer;
      font-size: 0;
    }
  </style>
</head>

<body>
  <audio id="music" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <button id="start" aria-label="Start music"></button>

  <script>
    const music = document.getElementById("music");
    const startButton = document.getElementById("start");

    music.volume = 1;

    async function startMusic() {
      try {
        await music.play();
        startButton.remove();
      } catch (error) {
        console.log("Playback was blocked:", error);
      }
    }

    // Attempt automatic playback
    startMusic();

    // Start after the first click or tap if autoplay is blocked
    startButton.addEventListener("click", startMusic);
    startButton.addEventListener("touchstart", startMusic);
  </script>
</body>
</html>
